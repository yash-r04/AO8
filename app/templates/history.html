{% extends "base.html" %}
{% block title %}History{% endblock %}
{% block content %}

<div class="page-header">
  <div class="page-tag mono">// history</div>
  <h1 class="page-title">Evaluation history</h1>
  <p class="page-sub">All benchmark jobs you've run.</p>
</div>

<div id="jobs-container" class="mono">Loading...</div>

<script>
async function loadHistory() {
  const container = document.getElementById("jobs-container");
  try {
    const resp = await fetch("/results/api/history");
    if (!resp.ok) {
      container.innerHTML = `<pre class="hist-error">HTTP ${resp.status}</pre>`;
      return;
    }
    const jobs = await resp.json();
    if (jobs.length === 0) {
      container.innerHTML = "<p class='page-sub'>No evaluation jobs yet. <a href='/test'>Run one →</a></p>";
      return;
    }
    container.innerHTML = jobs.map(job => `
      <div class="hist-job" onclick="toggleDetail('${job.id}')">
        <div class="hist-job-top">
          <span><strong>${job.model_name || "Unknown model"}</strong> on <strong>${job.dataset_name || "Unknown dataset"}</strong></span>
          <span class="hist-status hist-status-${job.status}">● ${job.status.toUpperCase()}</span>
        </div>
        <div class="hist-job-meta">
          ${new Date(job.queued_at).toLocaleString()} · Attacks: ${(job.attack_config?.attacks || []).join(", ") || "—"}
        </div>
        <div class="hist-detail" id="detail-${job.id}"></div>
      </div>
    `).join("");
  } catch (err) {
    container.innerHTML = `<pre class="hist-error">${err.message}</pre>`;
  }
}

async function toggleDetail(jobId) {
  const detail = document.getElementById("detail-" + jobId);
  if (detail.style.display === "block") { detail.style.display = "none"; return; }
  detail.style.display = "block";
  if (detail.dataset.loaded) return;
  detail.dataset.loaded = "true";

  const resp = await fetch("/results/api/job/" + jobId);
  const data = await resp.json();
  if (data.error) { detail.innerHTML = `<p class="hist-error">${data.error}</p>`; return; }
  if (data.job.status !== "done") { detail.innerHTML = `<p>Job is ${data.job.status}.</p>`; return; }

  const cards = data.attack_results.map(r => {
    const riskClass = r.risk_score > 60 ? "risk-high" : r.risk_score > 30 ? "risk-medium" : "risk-low";
    return `
      <div class="hist-attack-card">
        <div class="hist-attack-top">
          <strong>${r.attack_type.toUpperCase()}</strong>
          <span class="${riskClass}">Risk: ${r.risk_score.toFixed(1)}</span>
        </div>
        <div class="hist-attack-stats">
          <span>Clean acc: <strong>${(r.clean_accuracy * 100).toFixed(1)}%</strong></span>
          <span>Robust acc: <strong>${(r.robust_accuracy * 100).toFixed(1)}%</strong></span>
          <span class="risk-high">Drop: -${(r.accuracy_drop * 100).toFixed(1)}%</span>
          <span>Flipped: ${r.n_samples_flipped}/${r.n_samples_total}</span>
        </div>
        ${r.safe_values_s3_key ? `<button class="btn btn-ghost" onclick="downloadSafeValues('${jobId}','${r.attack_type}',event)">⬇ Download Safe Values</button>` : ""}
      </div>`;
  }).join("");

  detail.innerHTML = `<h3>Attack Results</h3>${cards}
    <a class="btn btn-ghost" href="/results/${jobId}">Open full report →</a>`;
}

async function downloadSafeValues(jobId, attackType, event) {
  event.stopPropagation();
  const btn = event.target;
  btn.innerText = "⏳ Generating link...";
  const resp = await fetch(`/results/api/job/${jobId}/download-safe-values/${attackType}`);
  const data = await resp.json();
  if (data.download_url) { window.open(data.download_url, "_blank"); btn.innerText = "✅ Download started"; }
  else btn.innerText = "❌ " + data.error;
}

loadHistory();
</script>
{% endblock %}
