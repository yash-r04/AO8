<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AO8 — {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <div class="scan-line"></div>

  <nav class="navbar">
    <a href="/" class="nav-logo">
      <span class="logo-bracket">[</span>AO8 - Anti-Oceans 8<span class="logo-bracket">]</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
      <a href="/upload" class="nav-link {% if request.path == '/upload' %}active{% endif %}">Upload</a>
      <a href="/benchmark" class="nav-link {% if request.path == '/benchmark' %}active{% endif %}">Benchmark</a>
      <a href="/report" class="nav-link {% if request.path == '/report' %}active{% endif %}">Report</a>
    </div>
    <div class="nav-status">
      <span class="status-dot"></span>
      <span class="mono">system ready</span>
    </div>
  </nav>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span class="mono">AO8 // Adversarial Robustness Framework</span>
    <span class="mono footer-right">Yashaswini C Rao</span>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
